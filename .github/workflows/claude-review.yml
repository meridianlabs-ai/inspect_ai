# Read-only reviewer for the meridianlabs-ai/inspect_ai fork, on demand only:
# comment @review on a PR (or on an External-labeled issue) to run it.
# Release-please PRs are skipped, gated in the reusable workflow.
# Independent of the dev agent (claude.yml) — different trigger, different
# (lower) permissions.
#
# Auto-review on PR open / ready_for_review is deliberately OFF (decision:
# Ransom, 2026-09-16: no unasked CI reviews in any Meridian repo; reviews are
# driven from Orca workspaces). The `pull_request` trigger this stub carried
# never fired for PRs against `main` (GitHub resolves pull_request-family
# workflows from the PR's branches, and `main` is a pristine mirror without
# this file), but it did fire for PRs against `meridian` itself — #501 was
# reviewed unasked on open, 2026-09-16 — so it is removed together with its
# `if` clause. The dev agent's `request_review_after_open` in claude.yml is
# off for the same reason. The template in meridianlabs-ai/agents
# examples/claude-review-stub.yml keeps the trigger as a commented-out block;
# copy it back from there to restore auto-review.
#
# Caveat: PRs from forks — a maintainer can review a fork PR with an @review
# comment, the same trust decision made explicitly — the reusable's trig
# check enforces it (fork-head @review requires a commenter with write
# access, checked before checkout), and the run then treats the fork's tree
# as UNTRUSTED code: no runner-side provisioning, execution only inside the
# reviewer's OS-level sandbox, project Claude Code configuration stripped
# from the checkout, and the Claude engine even if the PR is labeled
# engine:codex (agents#59).
#
# `allowed_bots: "claude[bot]"` below stays so a bot-authored top-level
# `@review` comment still reaches the reviewer (claude-code-action rejects
# bot actors otherwise); write-access humans can `@review` any PR.

name: Review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    # Run on a PR comment containing @review (works on drafts, and on a fork
    # PR when the commenter has write access — see the header, sandboxed
    # path), or on an @review comment on an External-labeled issue. `@review`
    # does not collide with the dev agent's `@claude` trigger.
    # The two comment gates exclude the reviewer's own comments: reviewing
    # files that contain the trigger token makes it routine for the review
    # summary's prose to mention that token, which passes this cheap
    # substring gate and spawns a Review run whose newest-wins concurrency
    # CANCELS the very run that posted the summary, before it posts the
    # verdict marker; the loop then never engages (observed: agents#36
    # round 2, 2026-08-31 — a backticked mention; agents#20 round 2,
    # 2026-08-27 — a bare mention followed by '/'). The reusable's
    # word-boundary trig gate rejects both shapes, so the spawned run only
    # ever no-ops — but its concurrency entry does the damage the moment
    # the job starts, so it must not start at all. Hence two exclusions:
    # a backticked token (mirrors the word-boundary gate's deliberate
    # blindness to backticked mentions; deterministic) and the
    # claude-review-comment marker the reviewer is prompted to stamp on
    # every top-level comment it posts (covers bare non-word-boundary
    # mentions like agents#20's; prompt-driven). Cost: a comment carrying
    # either alongside a genuine bare trigger is wrongly skipped — rare,
    # recoverable by re-commenting the bare token alone.
    # author_association filter (OWNER/MEMBER/COLLABORATOR) on both comment
    # paths: a COST filter, not the gate (the shape the dev stub's
    # `claude-auto` job uses). On a public repo anyone can comment `@review`;
    # without this every such comment spun a runner (Claude Security
    # 4085111). It is not authoritative — CONTRIBUTOR is anyone with a
    # merged commit, and whether org members show as MEMBER depends on org
    # settings — so the reusable workflow's trig check (a fail-closed
    # permission lookup on the actor, before any write or checkout) remains
    # the authority. A writer whose association is reported looser than
    # expected is dropped here silently — trig would have AUTHORIZED them,
    # so this filter is what they hit, and there is no fallback path: a
    # collaborator re-triggers. The loops' hand-back passes: their land jobs
    # post `@review` as the machine account, a User with write access. A
    # Bot commenter (the payload's user.type — a GitHub App, `[bot]` suffix
    # or not) passes too: its association is NONE whatever it may do, and
    # the reusable's `allowed_bots` input is what decides a bot's request
    # (its trig step refuses every bot not named there), so the filter must
    # not drop an allow-listed bot first. Bounded cost: only Apps installed
    # on the repo can comment as a Bot, and github-actions[bot] triggers no
    # workflow. Phase 2's App identity passes the same way and is admitted
    # by the reusable's TRUSTED_LOGINS.
    if: >
      (github.event.issue.pull_request != null &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.type == 'Bot') &&
       contains(github.event.comment.body, '@review') &&
       !contains(github.event.comment.body, '`@review`') &&
       !contains(github.event.comment.body, '<!-- claude-review-comment -->')) ||
      (github.event.issue.pull_request == null &&
       contains(github.event.issue.labels.*.name, 'External') &&
       (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        github.event.comment.user.type == 'Bot') &&
       contains(github.event.comment.body, '@review') &&
       !contains(github.event.comment.body, '`@review`') &&
       !contains(github.event.comment.body, '<!-- claude-review-comment -->'))
    uses: meridianlabs-ai/agents/.github/workflows/claude-review.yml@main
    # The machine account's secrets, for the gate's deterministic ack/stage
    # steps (eyes reaction + board stage) and the land job's posts; never
    # handed to the review agent, which stays read-only. Absent -> the gate
    # steps no-op and the land job posts with the job token.
    secrets:
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      MARVIN_APP_PRIVATE_KEY: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    permissions:
      contents: read
      pull-requests: read     # the review is posted by the land job as the machine account (agents#114)
      issues: read
      id-token: write
      actions: read
    with:
      # Honor a dev-agent @review comment (it runs as claude[bot]; the action
      # rejects bot actors unless listed here). The
      # reviewer is read-only, so this only ever starts a review — never a write.
      allowed_bots: "claude[bot]"
      # Fork-specific reviewer guidance. On this fork only top-level PR comments
      # reach the dev agent, so point authors there for follow-ups. The reviewer
      # must never emit ANY literal trigger token — @review would retrigger this
      # workflow (which accepts bot comments), and @claude/@i-am-marvin spawn
      # dev-agent runs that waste a checkout + provision before being rejected
      # (observed on PR 211; backticks do NOT protect — matching is substring).
      append_system_prompt: >-
        Repo context: on the meridianlabs-ai/inspect_ai fork, only top-level PR
        comments trigger the agents — inline review-comment replies do NOT reach
        the dev agent. When a finding needs action, tell the author to reply with
        a top-level at-claude comment on the PR (written out like that — the
        author types the @ themselves), not an inline reply. NEVER write a
        literal @-prefixed trigger token in your output — not for claude, not
        for i-am-marvin, not for the review trigger, not even inside backticks:
        your comments are matched by substring, so a quoted token still fires
        the workflow (a review re-trigger, or a wasted dev-agent run). Refer to
        them as "an at-claude comment" and "a review request".
        REGRESSION CHECKLIST for this repo — check the diff against each
        (these are the recurring miss shapes, all observed in real reviews):
        (1) cancellation is BaseException — cleanup or completion handlers on
        `except Exception` silently skip on cancel; anything that must
        complete (ModelEvent completion, buffer flushes) needs finally or
        BaseException handling, and a leaked pending event serializes into
        the user's eval log — durable damage. (2) new work sharing a running
        eval's bounded resources (max_connections semaphores, working
        limits): analyze starvation and deadline interplay — wall-clock
        limits keep running while a sample is blocked or held. (3) the eval
        event loop must only cheaply shovel data — no synchronous CPU-heavy
        work (deepcopy of transcripts, attachment resolution) on paths that
        claim not to disturb the eval. (4) fresh execution contexts that
        rebind SOME context vars: enumerate every var downstream code reads;
        vars without defaults raise LookupError. (5) quiescence or settle
        predicates must consult real in-flight signals
        (transcript.pending_events), not event-count settling. (6) parallel
        or interim execution paths must capture the eval's RESOLVED config
        (GenerateConfig, live ctl retunes), not construct defaults. (7)
        per-item error containment: check which exception classes or code
        paths escape the per-item try and abort the whole batch. (8)
        supersession and staleness (task retry, detach) must be re-checked
        inside every long-running phase, not only between items. (9)
        serialized-format compatibility: eval logs and checkpoints written by
        older versions must still read; control-channel changes follow the
        CONTROL_API_VERSION skew policy; terse CLI output is a parsed
        contract. (10) diff hygiene: verify claims against the true
        merge-base — a branch behind its base makes unrelated features look
        deleted.
