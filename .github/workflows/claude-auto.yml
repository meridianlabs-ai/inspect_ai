# @auto autonomous loop for the meridianlabs-ai/inspect_ai fork
# (design/auto-agent.md in the agents repo).
# Lives on the `meridian` default branch (workflow_run + issue_comment both
# resolve from the default branch, so they fire here even though the PRs target
# pristine `main`). Independent of claude.yml (dev) and claude-review.yml.
#
# Requires the machine account's org secrets scoped to this repo (same as
# claude.yml): MARVIN_APP_CLIENT_ID and MARVIN_APP_PRIVATE_KEY.

name: Claude Auto

on:
  # Phase 1: react to CI completing (so we can fix failures) — upstream's
  # "Build", which runs on claude/* -> main PRs.
  workflow_run:
    workflows: ["Build"]
    types: [completed]
  # Phase 2/3: react to the reviewer's marked summary comment. issue_comment
  # fires from the default branch, so this works on pristine-base forks too
  # (unlike pull_request_review).
  issue_comment:
    types: [created]

jobs:
  # CI-failure -> fix. Only a *failed* CI run for a *same-repo* PR (same-repo
  # excludes fork heads; it does NOT mean writer-authored — any account that
  # may open a PR here can produce such a run). The reusable workflow does
  # the authoritative gate: it first binds the run to its PR from trusted
  # context (design/auto-agent.md in the agents repo → Binding the failed
  # run to its PR), then checks the `auto` label, who applied it, and the
  # attempt cap. The three `with:` values below are the event's own fields,
  # forwarded as-is so the reusable can compare like with like:
  # `pull_requests[0].number` is an ASSOCIATION, not the triggering PR —
  # GitHub's schema says the list "do[es] not necessarily indicate pull
  # requests that triggered the run" (two PRs from one branch into different
  # bases both appear, in no specified order) — so the reusable derives the
  # PR itself (the one same-repo PR from `head_branch` open when the run was
  # created, at the run's head SHA, not retargeted since) and skips unless
  # this number agrees; it also requires the run's actors (who started and
  # who re-ran it) to be the machine account or write-access accounts before
  # any counter, stage, merge or model work. What it cannot establish, and
  # does not claim: which PR GitHub considered the trigger when two share
  # the branch, or the merge commit the run built.
  ci-fix:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: meridianlabs-ai/agents/.github/workflows/claude-auto.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets:
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      MARVIN_APP_PRIVATE_KEY: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      head_branch: ${{ github.event.workflow_run.head_branch }}
      pr_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      ci_run_id: ${{ github.event.workflow_run.id }}
      # Fork context (this fork is special; see claude.yml). Work only on the
      # existing PR branch; never commit to main/meridian or touch meridian-only
      # .github/workflows files. This fork's PRs are a review surface and are
      # NEVER merged here — a human promotes finished work upstream.
      append_system_prompt: >-
        Repo context: meridianlabs-ai/inspect_ai is a fork of
        UKGovernmentBEIS/inspect_ai (upstream); this PR's branch was cut from
        pristine `main`. Work only on this existing branch and push to it —
        never commit to `main` or `meridian` directly, and never modify
        meridian-only files under .github/workflows (claude.yml, claude-auto.yml,
        claude-review.yml, sync-upstream.yml). Verify per CLAUDE.md: install the
        project (pip install -e ".[dev]"), run pytest on tests you touched, then
        ruff check and mypy on changed files; if verification is impossible, say
        exactly what was not run. CHANGELOG: for product-functionality changes
        (not test/build-only) add a single-line entry under "## Unreleased" at
        the top of CHANGELOG.md (create that section if absent). This fork's PRs
        are a review surface only and are NEVER merged here.

  # Review -> fix / handoff. The marker is a cheap router (it's forgeable — only
  # the reviewer posts it in practice); the reusable workflow does the authoritative
  # gating (comment author == reviewer, same-repo, `auto` label, round cap), so
  # the security boundary is there, not here.
  review-fix:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != '' &&
      contains(github.event.comment.body, '<!-- claude-review-summary -->')
    uses: meridianlabs-ai/agents/.github/workflows/claude-auto-review.yml@main
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    secrets:
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      MARVIN_APP_PRIVATE_KEY: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    with:
      pr_number: ${{ github.event.issue.number }}
      comment_author: ${{ github.event.comment.user.login }}
      # Same fork context, plus: the "handoff" here means ready for a human to
      # promote upstream (fork PRs are never merged in-fork), not "ready to merge".
      append_system_prompt: >-
        Repo context: meridianlabs-ai/inspect_ai is a fork of
        UKGovernmentBEIS/inspect_ai (upstream); this PR's branch was cut from
        pristine `main`. Work only on this existing branch and push to it —
        never commit to `main` or `meridian` directly, and never modify
        meridian-only files under .github/workflows (claude.yml, claude-auto.yml,
        claude-review.yml, sync-upstream.yml). Verify per CLAUDE.md: install the
        project (pip install -e ".[dev]"), run pytest on tests you touched, then
        ruff check and mypy on changed files; if verification is impossible, say
        exactly what was not run. CHANGELOG: for product-functionality changes
        (not test/build-only) add a single-line entry under "## Unreleased" at
        the top of CHANGELOG.md (create that section if absent). IMPORTANT: this
        fork's PRs are a review surface and are NEVER merged here — finished work
        is promoted by a HUMAN opening an upstream PR from the same branch
        (gh pr create --repo UKGovernmentBEIS/inspect_ai --head
        meridianlabs-ai:BRANCH). So when you hand off, frame it as "ready for a
        human to promote upstream", not "ready to merge", and never merge.
