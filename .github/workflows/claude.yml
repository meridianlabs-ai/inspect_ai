# Claude stub for the meridianlabs-ai/inspect_ai fork.
# Lives on the `meridian` default branch. Claude branches from and opens PRs
# against pristine `main` (which mirrors UKGovernmentBEIS/inspect_ai) so review
# diffs never include meridian infra commits. See the two-stage PR flow in the
# README.
#
# Requires the Claude GitHub App installed on the repo (org-level install
# covers this) and the machine account's two org secrets scoped to it,
# MARVIN_APP_CLIENT_ID and MARVIN_APP_PRIVATE_KEY (the GitHub App the
# workflow's gate and land jobs act as; without them pushes and PRs come
# from github-actions[bot] and trigger nothing). Model auth uses Workload
# Identity Federation — no API-key secret, but `id-token: write` below is
# required for the OIDC exchange.
#
# Triggers are limited to issue_comment + issues on purpose: GitHub resolves
# those from the default branch (meridian, where this file lives), but it
# resolves pull_request-family events (pull_request_review_comment,
# pull_request_review) from the PR's own branches — which here are `main` / a
# `main`-cut feature branch, neither of which carries this workflow. So those
# events can NEVER fire on the fork; including them would only advertise a
# trigger that does nothing. Mention @claude in a TOP-LEVEL comment (or use the
# `claude` label) — inline review-comment replies are not picked up here.

name: Claude

# `issue_comment: edited` is included so that ADDING @claude/@auto to an
# existing comment (a common way people invoke the agent after the fact) fires
# the workflow — GitHub only delivers the edited action when it's subscribed
# here. The job `if:` below guards it to edits that newly introduce the phrase
# (via github.event.changes.body.from), so re-editing a comment that already
# mentioned the agent does NOT re-trigger it.
on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, labeled]
  # SCRATCH BRANCH ONLY (executed-paths-step2-provision-verify): dispatch runs
  # verify-provision below; the agent jobs' gates are false for this event.
  workflow_dispatch:

jobs:
  claude:
    # Cheap gate to avoid spending runner minutes on unrelated events; the
    # action does its own authoritative trigger check. Two phrases summon the
    # one-shot dev agent: @claude and @i-am-marvin (the machine account — a real
    # user, so the mention resolves to it and pings nothing else). They do the
    # same thing; the action's trigger_phrase is single-valued, so
    # `with.trigger_phrase` below resolves which phrase the *event's own text*
    # contains (comment body for a comment, issue body/title for an opened
    # issue — the same source the action checks) and this gate fires if that
    # text has either phrase; the `claude` label fires it on its own.
    #
    # Machine-account guard: github.actor != 'i-am-marvin' over the whole gate,
    # so a comment/issue authored by the machine account can't self-trigger
    # the dev agent and loop (its own output — and the fork guidance below —
    # can contain @claude/@i-am-marvin). Its Phase 2 GitHub App login,
    # meridian-marvin[bot], is covered by the `[bot]` clause and stays
    # excluded here on purpose. Hoisted rather than per-source: the
    # sources are OR'd, so guarding only the comment branch is bypassable by a
    # phrase left in the enclosing issue body/title.
    #
    # Sources are scoped to the event that carries them (github.event.action /
    # event_name), so a comment event is judged by the comment alone — a stale
    # @claude in the enclosing issue can't fire a runner-spin for an unrelated
    # comment, nor mask an alias typed in the comment. Issue body/title count
    # only on `opened`: the action checks them only there (trigger.ts), so
    # matching them on `labeled` too let any later label on an issue whose
    # body mentions a phrase spin a runner the action then no-op'd.
    #
    # On an edited comment (the only `edited` action we subscribe to), fire only
    # when the edit newly introduced a phrase — comparing against the pre-edit
    # body — so re-editing a comment that already mentioned one does not
    # re-trigger. Known limitation: contains() is a substring test, looser than
    # the action's word-boundary trigger; a pre-edit body holding a phrase only
    # as a NON-triggering substring (in backticks, or a token like foo@claude)
    # blocks the edit path. Acceptable for a cheap gate (no regex in workflow
    # expressions); the action remains the authoritative check on what fires.
    if: |
      github.actor != 'i-am-marvin' && !endsWith(github.actor, '[bot]') && (
        ( github.event.action == 'edited'
          && ( contains(github.event.comment.body, '@claude')
            || contains(github.event.comment.body, '@i-am-marvin') )
          && !( contains(github.event.changes.body.from, '@claude')
            || contains(github.event.changes.body.from, '@i-am-marvin') ) ) ||
        ( github.event.action == 'created' && (
            contains(github.event.comment.body, '@claude') ||
            contains(github.event.comment.body, '@i-am-marvin')
        ) ) ||
        ( github.event_name == 'issues' && github.event.action == 'opened' && (
            contains(github.event.issue.body, '@claude') ||
            contains(github.event.issue.body, '@i-am-marvin') ||
            contains(github.event.issue.title, '@claude') ||
            contains(github.event.issue.title, '@i-am-marvin')
        ) ) ||
        ( github.event_name == 'issues' && github.event.action == 'labeled'
          && github.event.label.name == 'claude' )
      )
    uses: meridianlabs-ai/agents/.github/workflows/claude.yml@main
    # Pass the machine account's secrets (org secrets) through to the
    # reusable workflow so agent-opened PRs trigger CI and @review: the
    # GitHub App's client id and private key, from which the workflow's
    # gate and land jobs mint per-job tokens (Phase 2). Passed explicitly —
    # NOT via
    # `secrets: inherit` — so this repo's other secrets aren't exposed to an
    # external workflow pinned to a mutable @main ref (least privilege; the
    # reusable workflow consumes only the secrets named here).
    # Absent secrets resolve to empty: the agent still runs, just with
    # issue-triggered PR creation degraded (see the reusable workflow's
    # secrets.MARVIN_APP_CLIENT_ID and design/auto-agent.md).
    secrets:
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      MARVIN_APP_PRIVATE_KEY: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    # Agent runs restore caches, never save them (agents repo: design/agent-cache-scope.md).
    cache-mode: read
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      # provision (optional; agents#136): the repository's provisioning recipe
      # — bash run as the unprivileged agent user in the checkout, in place of
      # the generic `uv venv && uv pip install -e .[dev]`. Codex runs use it
      # today; Claude runs keep this repository's claude-setup action until
      # they move to an agent user too, and then use this recipe instead
      # (design/executed-paths-residual.md in the agents repo). The codex job
      # never runs claude-setup (a composite runs as the runner; nothing from
      # the checkout may run as the runner there), so put here what
      # claude-setup does that the generic recipe does not. uv is on PATH,
      # HOME is the agent user's (/home/codex), no sudo, network on; create
      # .venv so the agent's tools are found. A stub that still sets the
      # earlier `codex_provision` keeps working: it is used when `provision`
      # is empty. Examples —
      # a Python pin:          uv venv --python 3.11 && uv pip install -e ".[dev]"
      # a lockfile sync:       uv venv --python 3.11 && uv sync --dev
      # Node tooling:          corepack enable --install-directory ~/.local/bin && pnpm install --frozen-lockfile
      provision: &provision |
        uv venv --python 3.11
        uv pip install -e ".[dev]"
      # trigger_phrase is single-valued, so resolve it from the SAME source the
      # action will check for this event (comment > issue), not from a union of
      # all sources — otherwise a stale @claude in an enclosing issue would mask
      # an @i-am-marvin typed in a comment, resolving @claude and then
      # no-op'ing (the action only checks the comment body on a comment
      # event). Within a source, default @claude and only switch to
      # @i-am-marvin when that's what's present. On the `claude` label event
      # the phrase is moot — the action fires on label_trigger and the reusable
      # workflow's trig step matches the label name, neither reads the body —
      # so the issue branch resolving @i-am-marvin from a body mention there is
      # harmless; the trailing @claude is the fallback for an event with no
      # matching source.
      # Caveat: this pick is substring-based (workflow expressions have no
      # regex), so it also SELECTS which phrase the action then re-checks with
      # word boundaries. In the contrived case where the other phrase appears
      # only as a NON-triggering substring (backticked, or glued into a token
      # like foo@i-am-marvin) a genuine trigger can be mis-resolved and no-op,
      # not merely cost gate minutes. Accepted: the collision needs someone to,
      # in one comment, write one phrase for real and the other as a bare
      # substring — and both phrases route to the same dev agent anyway.
      trigger_phrase: >-
        ${{
        github.event.comment && (contains(github.event.comment.body, '@i-am-marvin') && '@i-am-marvin' || '@claude') ||
        (contains(github.event.issue.body, '@i-am-marvin') || contains(github.event.issue.title, '@i-am-marvin')) && '@i-am-marvin' ||
        '@claude'
        }}
      base_branch: main
      # No automatic review of the PRs this agent opens: a review is asked for
      # (an @review comment, or from an Orca workspace), never posted by the
      # land job (decision: Ransom, 2026-09-16; was "true" while the fork
      # substituted this for PR-open auto-review, which is off everywhere now).
      request_review_after_open: "false"
      # Fork-specific guidance. Goes through the reusable workflow's
      # append_system_prompt input (a single composed --append-system-prompt),
      # NOT claude_args — a second --append-system-prompt would collide with the
      # composed one. The fork can't ship a CLAUDE.md/AGENTS.md (main must stay
      # pristine and a file on meridian isn't on the main-cut work branches).
      # Anchored (&fork_prompt) so the @auto kickoff job below reuses the exact
      # same guidance — the two agents do the same fork work, and an anchor
      # keeps them from drifting apart.
      append_system_prompt: &fork_prompt >-
        Repo context: meridianlabs-ai/inspect_ai is a fork of
        UKGovernmentBEIS/inspect_ai (upstream). Branch `main` is a pristine
        mirror of upstream main: always branch from it and open PRs against it,
        never against the `meridian` branch, and never commit to `main` or
        `meridian` directly. Before opening a PR, verify your work per
        CLAUDE.md: install the project (pip install -e ".[dev]"), run pytest on
        the tests you added or touched, then ruff check and mypy on changed
        files; fix what they surface. If verification is impossible (a tool is
        blocked or the environment cannot be set up), state exactly what was not
        run in the PR description. When you finish implementing work from an
        issue, open a draft PR in this fork (base: main) with `gh pr create`
        rather than only linking a compare URL. In the PR description, reference
        the originating issue FULLY-QUALIFIED — write `Fixes
        meridianlabs-ai/inspect_ai#N`, never a bare `Fixes #N` (this includes
        the PR template's "Fixes #" line). A bare `#N` is repo-relative, so when
        a human promotes this work by opening an upstream PR from the same
        branch the reference silently rebinds to UKGovernmentBEIS/inspect_ai's
        issue #N — a different, unrelated issue; the fully-qualified form keeps
        it pointing at this fork's issue wherever the body is reused. PRs within this fork are a
        review surface only and are never merged here; finished work is promoted
        by a human opening an upstream PR from the same branch (gh pr create
        --repo UKGovernmentBEIS/inspect_ai --head meridianlabs-ai:BRANCH). When
        asked to address feedback from an upstream PR, read its comments with gh
        (upstream is public) and push fixes to the same branch in this fork; the
        upstream PR updates automatically. Never modify files under
        .github/workflows that are meridian-only (claude.yml, sync-upstream.yml).
        CHANGELOG: for changes to product functionality (not for test-only or
        build-only changes) add a CHANGELOG entry. Put it in the "## Unreleased"
        section at the top of the file; if that section does not exist, create
        it. If "## Unreleased" already has entries, group the new entry with
        similar items if any, otherwise add it at the end of the list. The entry
        must be a single line and a single sentence.
      # Appended to the shared branch_sync_prompt (not replacing it) — adds the
      # CHANGELOG-merge check, which is fork-specific since the CHANGELOG
      # convention is. Fires only on PR follow-up runs, where the merge happens.
      branch_sync_append: &fork_branch_sync >-
        If this branch added a CHANGELOG entry, review the merge result
        carefully: the default merge resolution can move your entry out of the
        "## Unreleased" section (e.g. under a released heading). After merging,
        always verify your CHANGELOG entry is still under "## Unreleased" and
        move it back if it was relocated.

  # @auto kickoff (distinct from the one-shot `claude` above). An `auto` label or
  # `@auto` mention drives the issue autonomously: the dev agent opens a PR, the
  # PR inherits the `auto` label (so the loop in claude-auto.yml engages), and it
  # runs to a human handoff. Same reusable dev workflow, different trigger — the
  # action's trigger_phrase/label_trigger are single-valued, so `auto` needs its
  # own invocation. Needs the machine account's secrets (the PR must trigger
  # CI/@review).
  claude-auto:
    # See the `claude` job's `if:` — same edited-comment guard, so adding @auto
    # to an existing comment kicks off the autonomous loop but re-editing a
    # comment that already mentioned @auto does not re-fire it (which could
    # otherwise open a duplicate PR). Same machine-account guard too: @auto is
    # the loop-prone trigger, so keep the machine account from kicking it off
    # (nothing in the designed loop relies on marvin posting @auto).
    # The auto-LABEL path carries the same machine-account guard, under both
    # of its logins (`i-am-marvin`, the User; `meridian-marvin[bot]`, the
    # GitHub App): a label the machine account applies is not a human's
    # decision to hand the issue to the autonomous agent — the triage
    # pipeline used to apply `auto` as marvin from an agent's manifest, and
    # that agent had read test output, which anyone can shape (Claude
    # Security finding 4628345; the exception was added for inspect_ai#236).
    # A triage-filed issue is read by a human, who applies `auto` themselves
    # if the brief is worth automating; the label event's actor is then that
    # human, and the reusable workflow's trigger check verifies their write
    # access before anything runs. The gate reads the label NAME (no
    # quoted-token hazard); every bot stays excluded, github-actions[bot]
    # included. Comment/body paths keep the full guard.
    # author_association filter (OWNER/MEMBER/COLLABORATOR) on the text
    # paths: a COST filter, not the gate. On a public repo anyone can comment
    # `@auto` on a PR; without this every such comment spun a runner. It is
    # not authoritative — CONTRIBUTOR is anyone with a merged commit, and
    # whether org members show as MEMBER depends on org settings — so the
    # reusable workflow's trigger check (a fail-closed permission lookup on
    # the actor, before any write) remains the authority. A writer whose
    # association is reported looser than expected is dropped here silently
    # — trig would have AUTHORIZED them, so this filter is what they hit; the
    # `auto` label path above carries no association filter and is their
    # fallback. The issue-body branch is scoped to `issues: opened` like the
    # `claude` job's: an issue_comment payload also carries
    # issue.body/author_association, so without the event scope a
    # member-authored issue mentioning @auto would let every comment from
    # anyone spin a runner, and without the action scope so would any later
    # label added to that issue (trig skips both, but the runner is paid
    # for). The label path is the leading branch, so no label clause is
    # repeated inside the guarded one.
    if: |
      ( github.event_name == 'issues' && github.event.action == 'labeled'
        && github.event.label.name == 'auto'
        && github.actor != 'i-am-marvin' && !endsWith(github.actor, '[bot]') ) ||
      ( github.actor != 'i-am-marvin' && !endsWith(github.actor, '[bot]') && (
        ( github.event.action == 'edited'
          && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
          && contains(github.event.comment.body, '@auto')
          && !contains(github.event.changes.body.from, '@auto') ) ||
        ( github.event.action != 'edited' && (
            ( contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
              && contains(github.event.comment.body, '@auto') ) ||
            ( github.event_name == 'issues' && github.event.action == 'opened'
              && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
              && ( contains(github.event.issue.body, '@auto')
                || contains(github.event.issue.title, '@auto') ) )
        ) )
      ) )
    uses: meridianlabs-ai/agents/.github/workflows/claude.yml@main
    secrets:
      MARVIN_APP_CLIENT_ID: ${{ secrets.MARVIN_APP_CLIENT_ID }}
      MARVIN_APP_PRIVATE_KEY: ${{ secrets.MARVIN_APP_PRIVATE_KEY }}
      # codex engine (design/codex-engine.md in the agents repo):
      # consumed only on items labeled engine:codex; optional.
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    # Agent runs restore caches, never save them (agents repo: design/agent-cache-scope.md).
    cache-mode: read
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    with:
      # provision (optional; agents#136): the repository's provisioning recipe
      # — bash run as the unprivileged agent user in the checkout, in place of
      # the generic `uv venv && uv pip install -e .[dev]`. Codex runs use it
      # today; Claude runs keep this repository's claude-setup action until
      # they move to an agent user too, and then use this recipe instead
      # (design/executed-paths-residual.md in the agents repo). The codex job
      # never runs claude-setup (a composite runs as the runner; nothing from
      # the checkout may run as the runner there), so put here what
      # claude-setup does that the generic recipe does not. uv is on PATH,
      # HOME is the agent user's (/home/codex), no sudo, network on; create
      # .venv so the agent's tools are found. A stub that still sets the
      # earlier `codex_provision` keeps working: it is used when `provision`
      # is empty. Examples —
      # a Python pin:          uv venv --python 3.11 && uv pip install -e ".[dev]"
      # a lockfile sync:       uv venv --python 3.11 && uv sync --dev
      # Node tooling:          corepack enable --install-directory ~/.local/bin && pnpm install --frozen-lockfile
      provision: *provision
      trigger_phrase: "@auto"
      label_trigger: "auto"
      base_branch: main
      # No automatic review of the PRs this agent opens: a review is asked for
      # (an @review comment, or from an Orca workspace), never posted by the
      # land job (decision: Ransom, 2026-09-16; was "true" while the fork
      # substituted this for PR-open auto-review, which is off everywhere now).
      request_review_after_open: "false"
      # Same fork guidance as the `claude` job (reused via the YAML anchor).
      append_system_prompt: *fork_prompt
      branch_sync_append: *fork_branch_sync

  # SCRATCH BRANCH ONLY: runs the stubs' `provision` recipe the way the codex
  # jobs of the reusable workflows do (create-codex-user, provision-fallback
  # with user: codex, reset-home, all @main), over `main` (the tree the agents
  # work on), then checks the tools as codex.
  verify-provision:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history, as the reusable workflows check out: the version
          # comes from the tags (setuptools_scm).
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the dispatched stubs
        uses: actions/checkout@v4
        with:
          path: .stub-src
          persist-credentials: false

      - name: Read the recipe from every caller job of the three stubs
        id: fx
        run: |
          set -euo pipefail
          all=$(for f in claude claude-auto claude-review; do
            yq -o=json 'explode(.) | [.jobs | to_entries[] | select(.value.uses) | {"file": "'"$f"'", "job": .key, "uses": .value.uses, "provision": .value.with.provision}]' ".stub-src/.github/workflows/$f.yml"
          done | jq -s 'add')
          echo "$all" | jq .
          [ "$(jq 'length' <<<"$all")" = 5 ] || { echo "::error::expected 5 caller jobs"; exit 1; }
          [ "$(jq '[.[].provision] | unique | length' <<<"$all")" = 1 ] || { echo "::error::recipes differ"; exit 1; }
          recipe=$(jq -r '.[0].provision // ""' <<<"$all")
          [ -n "$recipe" ] || { echo "::error::no provision recipe set"; exit 1; }
          printf 'recipe:\n%s\n' "$recipe"
          { echo "recipe<<RECIPE_EOF"; printf '%s\n' "$recipe"; echo "RECIPE_EOF"; } >>"$GITHUB_OUTPUT"
          rm -rf .stub-src
          git log -1 --format='project tree: main at %H'

      - name: Create codex user
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main

      - name: Provision as the codex user with the stubs' recipe
        id: setup
        timeout-minutes: 10
        uses: meridianlabs-ai/agents/.github/actions/provision-fallback@main
        with:
          user: codex
          recipe: ${{ steps.fx.outputs.recipe }}

      - name: Reset codex home
        uses: meridianlabs-ai/agents/.github/actions/create-codex-user@main
        with:
          mode: reset-home

      - name: Tools run as codex
        env:
          BIN: ${{ steps.setup.outputs.bin }}
          AS_CODEX: sudo -u codex -H --
        run: |
          set -euo pipefail
          echo "bin: $BIN"
          v=$($AS_CODEX .venv/bin/python -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "venv python: $v"
          [ "$v" = "3.11" ] || { echo "::error::expected Python 3.11, got $v"; exit 1; }
          loc=$($AS_CODEX .venv/bin/python -c 'import inspect_ai, os; print(os.path.dirname(inspect_ai.__file__))')
          echo "inspect_ai imported from: $loc"
          [ "$loc" = "$GITHUB_WORKSPACE/src/inspect_ai" ] || { echo "::error::not an editable install of the checkout"; exit 1; }
          for t in pytest ruff mypy; do
            [ -x ".venv/bin/$t" ] || { echo "::error::$t missing from .venv/bin"; exit 1; }
            $AS_CODEX ".venv/bin/$t" --version
          done
          $AS_CODEX .venv/bin/ruff check src/inspect_ai/_util
          $AS_CODEX .venv/bin/pytest tests/util/test_file.py -q -p no:cacheprovider
